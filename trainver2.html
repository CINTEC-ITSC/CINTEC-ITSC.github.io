<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acrobatic Train (アクロバティックトレイン)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b132b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 100vh;
            max-height: 700px;
            background: #111;
            box-shadow: 0 0 30px rgba(0,255,200,0.2);
            overflow: hidden;
            border-radius: 8px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* HUD UI Elements */
        .hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }
        .hud-panel {
            background: rgba(10, 20, 40, 0.75);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            border-radius: 8px;
            padding: 10px 16px;
            backdrop-filter: blur(4px);
        }
        .score-box {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 8px #00f0ff;
        }
        .speed-box {
            font-size: 14px;
            color: #ff0;
            margin-top: 4px;
            font-weight: 600;
        }
        .wheels-indicator {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }
        .wheel-status {
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .track-badge {
            display: inline-block;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            border-radius: 50%;
            background: #ff0055;
            color: #fff;
            font-size: 12px;
            box-shadow: 0 0 6px #ff0055;
        }
        .track-badge.rear {
            background: #00e5ff;
            box-shadow: 0 0 6px #00e5ff;
        }

        /* Overlay Screens */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 15, 30, 0.88);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 38px;
            margin-bottom: 5px;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.8), 0 0 30px rgba(0, 240, 255, 0.4);
        }
        h2.subtitle {
            font-size: 18px;
            color: #ff0055;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.6);
        }
        .instructions-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            max-width: 500px;
            margin-bottom: 25px;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
        }
        .instructions-card h3 {
            color: #ffea00;
            margin-bottom: 10px;
            font-size: 16px;
            text-transform: uppercase;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
        .key-badge {
            background: #2a3b5c;
            border: 1px solid #00f0ff;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            color: #00f0ff;
        }
        .btn {
            background: linear-gradient(45deg, #ff0055, #ff5500);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.9);
        }
        .game-over-stats {
            font-size: 20px;
            margin: 15px 0 25px;
            line-height: 1.8;
            color: #ddd;
        }
        .game-over-stats span {
            color: #00f0ff;
