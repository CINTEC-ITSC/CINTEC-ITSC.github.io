<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 電車跑酷 - Acrobatic Train Runner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .touch-btn {
            active: scale-95;
            transition: transform 0.1s, background-color 0.1s;
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-slate-900 text-white flex flex-col justify-between h-screen overflow-hidden">

    <!-- 3D WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- HUD Header Overlay -->
    <div class="relative z-10 p-4 sm:p-6 flex justify-between items-start pointer-events-none">
        <!-- Score & High Score -->
        <div class="ui-panel rounded-2xl p-4 flex flex-col gap-1 min-w-[150px] pointer-events-auto">
            <div class="text-xs text-slate-400 font-semibold tracking-wider uppercase">當前得分 SCORE</div>
            <div id="score-text" class="text-3xl font-extrabold text-amber-400 tracking-tight">0</div>
            <div class="text-xs text-slate-400 font-semibold tracking-wider uppercase mt-1">最高紀錄 HIGH</div>
            <div id="highscore-text" class="text-lg font-bold text-slate-200">0</div>
        </div>

        <!-- Speed & Distance -->
        <div class="ui-panel rounded-2xl p-4 flex flex-col gap-1 min-w-[140px] text-right pointer-events-auto">
            <div class="text-xs text-slate-400 font-semibold tracking-wider uppercase">車速 SPEED</div>
            <div class="flex items-baseline justify-end gap-1">
                <span id="speed-text" class="text-3xl font-extrabold text-emerald-400">80</span>
                <span class="text-xs text-emerald-500 font-bold">km/h</span>
            </div>
            <div class="text-xs text-slate-400 font-semibold tracking-wider uppercase mt-1">距離 DISTANCE</div>
            <div id="distance-text" class="text-lg font-bold text-slate-200">0 m</div>
        </div>
    </div>

    <!-- Mobile / On-Screen Touch Controls -->
    <div class="relative z-10 p-4 pb-6 flex justify-between items-end gap-4 pointer-events-none md:hidden">
        <!-- Front Bogie Controls -->
        <div class="flex flex-col items-center gap-1 pointer-events-auto">
            <span class="text-xs font-bold text-emerald-300 bg-slate-900/80 px-2 py-0.5 rounded-full border border-emerald-500/30">前輪轉向 (Front)</span>
            <div class="flex gap-2">
                <button id="btn-front-left" class="touch-btn bg-slate-800/90 active:bg-emerald-600 border border-emerald-500/40 text-emerald-400 text-xl font-bold w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg">←</button>
                <button id="btn-front-right" class="touch-btn bg-slate-800/90 active:bg-emerald-600 border border-emerald-500/40 text-emerald-400 text-xl font-bold w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg">→</button>
            </div>
        </div>

        <!-- Rear Bogie Controls -->
        <div class="flex flex-col items-center gap-1 pointer-events-auto">
            <span class="text-xs font-bold text-cyan-300 bg-slate-900/80 px-2 py-0.5 rounded-full border border-cyan-500/30">後輪轉向 (Rear)</span>
            <div class="flex gap-2">
                <button id="btn-rear-left" class="touch-btn bg-slate-800/90 active:bg-cyan-600 border border-cyan-500/40 text-cyan-400 text-xl font-bold w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg">←</button>
                <button id="btn-rear-right" class="touch-btn bg-slate-800/90 active:bg-cyan-600 border border-cyan-500/40 text-cyan-400 text-xl font-bold w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg">→</button>
            </div>
        </div>
    </div>

    <!-- Start / Game Over Modal -->
    <div id="game-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="ui-panel max-w-lg w-full rounded-3xl p-6 sm:p-8 flex flex-col items-center text-center shadow-2xl border border-white/20">
            <!-- Train Logo Icon -->
            <div class="w-16 h-16 bg-gradient-to-tr from-emerald-500 to-teal-400 rounded-2xl flex items-center justify-center mb-4 shadow-lg shadow-emerald-500/30">
                <svg class="w-10 h-10 text-slate-950" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h8m-8 4h8m-4 8l-3-3m6 0l3-3M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"></path>
                </svg>
            </div>

            <h1 id="modal-title" class="text-3xl sm:text-4xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-100 to-emerald-400 bg-clip-text text-transparent mb-2">
                3D 電車特技跑酷
            </h1>
            <p id="modal-subtitle" class="text-slate-300 text-sm sm:text-base mb-6">
                掌控前後輪轉向架，展現斜跨軌道特技與高空跳躍！
            </p>

            <!-- Control Guide -->
            <div class="w-full bg-slate-900/80 rounded-2xl p-4 mb-6 text-left border border-slate-700/60 text-xs sm:text-sm space-y-3">
                <div class="font-bold text-emerald-400 border-b border-slate-800 pb-1.5 flex items-center justify-between">
                    <span>🎮 操作指南 CONTROLS</span>
                    <span class="text-[10px] text-slate-400 bg-slate-800 px-2 py-0.5 rounded">鍵盤 / 觸控</span>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/50">
                        <div class="text-emerald-300 font-semibold mb-1">前輪轉向架</div>
                        <div class="text-slate-300 font-mono"><span class="bg-slate-700 px-1.5 py-0.5 rounded text-white font-bold">A</span> / <span class="bg-slate-700 px-1.5 py-0.5 rounded text-white font-bold">D</span> 或 <span class="bg-slate-700 px-1.5 py-0.5 rounded text-white font-bold">←</span> <span class="bg-slate-700 px-1.5 py-0.5 rounded text-white font-bold">→</span></div>
                    </div>
                    <div class="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/50">
                        <div class="text-cyan-300 font-semibold mb-1">後輪轉向架</div>
                        <div class="text-slate-300 font-mono"><span class="bg-slate-700 px-1.5 py-0.5 rounded text-white font-bold">Q</span> / <span class="bg-slate-700 px-1.5 py-0.5 rounded text-white font-bold">E</span> 或 <span class="bg-slate-700 px-1.5 py-0.5 rounded text-white font-bold">Z</span> <span class="bg-slate-700 px-1.5 py-0.5 rounded text-white font-bold">X</span></div>
                    </div>
                </div>
                <div class="text-slate-400 text-[11px] leading-relaxed pt-1">
                    ✨ <b class="text-amber-300">斜跨姿勢：</b>將前後輪置於不同軌道以切入軌道間隙吃金幣！<br>
                    🚀 <b class="text-amber-300">跳躍機制：</b>通過高低差斜坡飛躍空中，姿勢影響飛躍高度。
                </div>
            </div>

            <!-- Start / Retry Button -->
            <button id="start-btn" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 active:scale-98 text-slate-950 font-extrabold text-lg rounded-2xl shadow-lg shadow-emerald-500/25 transition-all duration-200">
                開始遊戲 START GAME
            </button>
        </div>
    </div>

    <!-- Main Game Logic Script -->
    <script>
        // --- GAME CONSTANTS & CONFIGS ---
        const TRACK_SPACING = 3.2;       // Distance between parallel tracks
        const TRACK_X_POS = [-TRACK_SPACING, 0, TRACK_SPACING]; // Track -1, 0, 1
        const BOGIE_DISTANCE = 6.0;      // Distance between front & rear bogie
        const INITIAL_SPEED = 30.0;       // Starting speed (m/s)
        const SPEED_INCREMENT = 0.35;    // Speed boost per second
        const MAX_SPEED = 90.0;          // Max speed cap
        const JUMP_VELOCITY = 15.0;      // Jump vertical velocity from ramp
        const GRAVITY = 32.0;             // Gravity acceleration

        // --- GAME STATE ---
        let scene, camera, renderer;
        let isPlaying = false;
        let score = 0;
        let highScore = localStorage.getItem('acrobatic_train_highscore') || 0;
        let distanceTraveled = 0;
        let currentSpeed = INITIAL_SPEED;

        // Bogie Lane Indexes (-1: Left, 0: Center, 1: Right)
        let frontTargetLane = 0;
        let rearTargetLane = 0;
        let frontX = 0, rearX = 0;
        
        // Train Vertical Physics
        let trainY = 0;
        let trainVY = 0;
        let isGrounded = true;

        // 3D Objects
        let trainGroup, frontBogieObj, rearBogieObj, trainBodyObj;
        let tracksGroup, environmentGroup;
        let obstacles = [];
        let coins = [];
        let ramps = [];
        let particles = [];

        // Procedural Generation Track Markers
        let spawnZ = -50;
        const SPAWN_CHUNK_SIZE = 120;
        const RENDER_DISTANCE = 350;

        // Delta Clock
        const clock = new THREE.Clock();

        // --- DOM ELEMENTS ---
        const scoreEl = document.getElementById('score-text');
        const highScoreEl = document.getElementById('highscore-text');
        const speedEl = document.getElementById('speed-text');
        const distanceEl = document.getElementById('distance-text');
        const gameModal = document.getElementById('game-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalSubtitle = document.getElementById('modal-subtitle');
        const startBtn = document.getElementById('start-btn');

        highScoreEl.innerText = highScore;

        // --- INITIALIZATION ---
        function init() {
            const container = document.getElementById('canvas-container');

            // 1. THREE.JS SCENE SETUP
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xb2e2f7); // Pale blue sky
            scene.fog = new THREE.FogExp2(0xb2e2f7, 0.0035);

            // Camera
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lightings
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff8e7, 0.85);
            sunLight.position.set(40, 80, 20);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 250;
            const d = 40;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // Groups
            tracksGroup = new THREE.Group();
            environmentGroup = new THREE.Group();
            scene.add(tracksGroup);
            scene.add(environmentGroup);

            // Build Scene Base
            createGrassAndMountains();
            createTrainModel();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            setupControls();

            // Initial Render Loop
            requestAnimationFrame(animate);
        }

        // --- PROCEDURAL SCENE GENERATION ---

        // Grass Ground Plane & Background Distant Mountains
        function createGrassAndMountains() {
            // Infinite Grass Ground Plane
            const groundGeo = new THREE.PlaneGeometry(600, 1500);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x5a9e32 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.15;
            ground.receiveShadow = true;
            scene.add(ground);

            // Distant Low Mountains / Hills
            const mountainGeo = new THREE.ConeGeometry(80, 45, 7);
            const mountainMat = new THREE.MeshLambertMaterial({ color: 0x7fa274, flatShading: true });

            for (let i = 0; i < 18; i++) {
                const mountain = new THREE.Mesh(mountainGeo, mountainMat);
                const side = (i % 2 === 0) ? 1 : -1;
                mountain.position.set(
                    side * (120 + Math.random() * 80),
                    10,
                    -400 + (i * 50) + Math.random() * 20
                );
                mountain.scale.set(1 + Math.random() * 0.5, 0.8 + Math.random() * 0.5, 1 + Math.random() * 0.5);
                scene.add(mountain);
            }
        }

        // Pine Tree Model Generator
        function createTreeMesh() {
            const treeGroup = new THREE.Group();
            
            // Trunk
            const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 2, 6);
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5a3d28 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 1;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            // Foliage (Conical Pine)
            const foliageMat = new THREE.MeshLambertMaterial({ color: 0x1e5628, flatShading: true });
            const cone1 = new THREE.Mesh(new THREE.ConeGeometry(1.8, 3, 6), foliageMat);
            cone1.position.y = 2.5;
            cone1.castShadow = true;
            treeGroup.add(cone1);

            const cone2 = new THREE.Mesh(new THREE.ConeGeometry(1.4, 2.5, 6), foliageMat);
            cone2.position.y = 3.8;
            cone2.castShadow = true;
            treeGroup.add(cone2);

            return treeGroup;
        }

        // --- 3D TRAIN MODEL CREATION (AUTHENTIC SPECIFICATIONS) ---
        function createTrainModel() {
            trainGroup = new THREE.Group();

            // Bogie Base Wheels Assemblies
            const bogieGeo = new THREE.BoxGeometry(1.6, 0.4, 2.2);
            const bogieMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });

            frontBogieObj = new THREE.Mesh(bogieGeo, bogieMat);
            rearBogieObj = new THREE.Mesh(bogieGeo, bogieMat);
            frontBogieObj.position.set(0, 0.3, -BOGIE_DISTANCE / 2);
            rearBogieObj.position.set(0, 0.3, BOGIE_DISTANCE / 2);

            trainGroup.add(frontBogieObj);
            trainGroup.add(rearBogieObj);

            // Main Train Body Wrapper
            trainBodyObj = new THREE.Group();

            // Train Main Body Shell (Light Gray/White)
            const bodyWidth = 2.2, bodyHeight = 2.7, bodyLength = 9.2;
            const bodyGeo = new THREE.BoxGeometry(bodyWidth, bodyHeight, bodyLength);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xededed, roughness: 0.3 });
            const mainBody = new THREE.Mesh(bodyGeo, bodyMat);
            mainBody.position.y = bodyHeight / 2 + 0.5;
            mainBody.castShadow = true;
            mainBody.receiveShadow = true;
            trainBodyObj.add(mainBody);

            // Green Stripe Ribbon (Side & Front Accent)
            const stripeMat = new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.2 }); // Bright green stripe
            const sideStripeGeo = new THREE.BoxGeometry(2.26, 0.22, bodyLength + 0.02);
            const sideStripe = new THREE.Mesh(sideStripeGeo, stripeMat);
            sideStripe.position.y = 1.1;
            trainBodyObj.add(sideStripe);

            // Front Windshield & Windows
            const windowMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.1 });
            const frontWindow = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.9, 0.1), windowMat);
            frontWindow.position.set(0, 2.2, -bodyLength / 2 - 0.02);
            trainBodyObj.add(frontWindow);

            const rearWindow = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.9, 0.1), windowMat);
            rearWindow.position.set(0, 2.2, bodyLength / 2 + 0.02);
            trainBodyObj.add(rearWindow);

            // Side Windows
            for (let z = -3; z <= 3; z += 1.8) {
                const sideWinL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 1.2), windowMat);
                sideWinL.position.set(-bodyWidth / 2 - 0.02, 2.2, z);
                const sideWinR = sideWinL.clone();
                sideWinR.position.x = bodyWidth / 2 + 0.02;
                trainBodyObj.add(sideWinL);
                trainBodyObj.add(sideWinR);
            }

            // Headlights & Tail Lights (Yellow indicators / Red tail)
            const yellowLightMat = new THREE.MeshBasicMaterial({ color: 0xfbcb04 });
            const redLightMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });

            const frontLightL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.15, 0.1), yellowLightMat);
            frontLightL.position.set(-0.7, 1.4, -bodyLength / 2 - 0.03);
            const frontLightR = frontLightL.clone();
            frontLightR.position.x = 0.7;
            trainBodyObj.add(frontLightL);
            trainBodyObj.add(frontLightR);

            const tailLightL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.15, 0.1), redLightMat);
            tailLightL.position.set(-0.7, 1.1, bodyLength / 2 + 0.03);
            const tailLightR = tailLightL.clone();
            tailLightR.position.x = 0.7;
            trainBodyObj.add(tailLightL);
            trainBodyObj.add(tailLightR);

            // Roof Air Conditioners (White boxes with black vents)
            const acGeo = new THREE.BoxGeometry(1.4, 0.35, 1.8);
            const acMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db });
            const ventMat = new THREE.MeshBasicMaterial({ color: 0x111827 });

            [-2.2, 2.2].forEach(zPos => {
                const acUnit = new THREE.Mesh(acGeo, acMat);
                acUnit.position.set(0, bodyHeight + 0.65, zPos);
                
                // Black circular vent caps
                const vent = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.05, 12), ventMat);
                vent.position.set(-0.35, 0.2, 0);
                const vent2 = vent.clone();
                vent2.position.x = 0.35;
                acUnit.add(vent);
                acUnit.add(vent2);

                trainBodyObj.add(acUnit);
            });

            // Pantograph (Roof Power Collector Frame)
            const pantoMat = new THREE.MeshStandardMaterial({ color: 0x374151, metalness: 0.8 });
            const pantoBase = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 1.0), pantoMat);
            pantoBase.position.set(0, bodyHeight + 0.55, 0);
            
            const pantoArm1 = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.9), pantoMat);
            pantoArm1.rotation.z = Math.PI / 4;
            pantoArm1.position.set(-0.2, 0.4, 0);
            const pantoArm2 = pantoArm1.clone();
            pantoArm2.rotation.z = -Math.PI / 4;
            pantoArm2.position.x = 0.2;

            const pantoTop = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.04, 0.1), pantoMat);
            pantoTop.position.set(0, 0.75, 0);

            pantoBase.add(pantoArm1);
            pantoBase.add(pantoArm2);
            pantoBase.add(pantoTop);
            trainBodyObj.add(pantoBase);

            trainGroup.add(trainBodyObj);
            scene.add(trainGroup);
        }

        // --- TRACK & CHUNK PROCEDURAL GENERATOR ---
        function generateTrackChunk(startZ, length) {
            const chunkGroup = new THREE.Group();

            // Ballast Bed (Gravel base under rails)
            const ballastGeo = new THREE.BoxGeometry(TRACK_SPACING * 3 + 1.2, 0.2, length);
            const ballastMat = new THREE.MeshStandardMaterial({ color: 0x78716c, roughness: 0.9 }); // Gravel color
            const ballast = new THREE.Mesh(ballastGeo, ballastMat);
            ballast.position.set(0, -0.1, startZ - length / 2);
            ballast.receiveShadow = true;
            chunkGroup.add(ballast);

            // Ties/Sleepers & Steel Rails for 3 tracks
            const tieGeo = new THREE.BoxGeometry(2.2, 0.1, 0.25);
            const tieMat = new THREE.MeshStandardMaterial({ color: 0x44403c });
            const railGeo = new THREE.BoxGeometry(0.08, 0.15, length);
            const railMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.2 });

            TRACK_X_POS.forEach(xPos => {
                // Sleepers
                for (let z = 0; z < length; z += 1.2) {
                    const tie = new THREE.Mesh(tieGeo, tieMat);
                    tie.position.set(xPos, 0.02, startZ - z);
                    tie.receiveShadow = true;
                    chunkGroup.add(tie);
                }

                // Left & Right Rails
                [-0.75, 0.75].forEach(rOffset => {
                    const rail = new THREE.Mesh(railGeo, railMat);
                    rail.position.set(xPos + rOffset, 0.12, startZ - length / 2);
                    chunkGroup.add(rail);
                });
            });

            // Scenery - Trees on sides
            const treeMeshMaster = createTreeMesh();
            for (let z = 0; z < length; z += 12 + Math.random() * 8) {
                [-1, 1].forEach(side => {
                    const tree = treeMeshMaster.clone();
                    const treeX = side * (8 + Math.random() * 12);
                    tree.position.set(treeX, 0, startZ - z);
                    const scale = 0.8 + Math.random() * 0.5;
                    tree.scale.set(scale, scale, scale);
                    chunkGroup.add(tree);
                });
            }

            tracksGroup.add(chunkGroup);

            // Populate Chunk with Obstacles, Ramps & Collectibles
            spawnChunkEntities(startZ, length);
        }

        // --- OBSTACLES, RAMPS & COINS GENERATION ---
        function spawnChunkEntities(startZ, length) {
            const step = 28; // Distance interval between entity spawn clusters
            for (let z = startZ - 20; z > startZ - length; z -= step) {
                const randType = Math.random();

                if (randType < 0.35) {
                    // --- OBSTACLES ---
                    const trackIndex = Math.floor(Math.random() * 3);
                    const obsX = TRACK_X_POS[trackIndex];
                    const obsSubtype = Math.random();

                    if (obsSubtype < 0.35) {
                        // 1. Rock Boulder
                        const rockGeo = new THREE.DodecahedronGeometry(1.2, 1);
                        const rockMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.8 });
                        const rock = new THREE.Mesh(rockGeo, rockMat);
                        rock.position.set(obsX, 0.8, z);
                        rock.rotation.set(Math.random(), Math.random(), Math.random());
                        rock.castShadow = true;
                        rock.userData = { type: 'obstacle', radius: 1.1 };
                        scene.add(rock);
                        obstacles.push(rock);
                    } else if (obsSubtype < 0.7) {
                        // 2. Red "X" No Entry Signboard (Exact replica)
                        const signGroup = new THREE.Group();
                        
                        // Posts
                        const postGeo = new THREE.CylinderGeometry(0.05, 0.05, 2);
                        const postMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
                        const p1 = new THREE.Mesh(postGeo, postMat);
                        p1.position.set(-0.9, 1, 0);
                        const p2 = p1.clone();
                        p2.position.x = 0.9;
                        signGroup.add(p1);
                        signGroup.add(p2);

                        // White Board
                        const boardGeo = new THREE.BoxGeometry(2.0, 1.2, 0.1);
                        const boardMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
                        const board = new THREE.Mesh(boardGeo, boardMat);
                        board.position.set(0, 1.6, 0);
                        signGroup.add(board);

                        // Red "X" Marker Lines
                        const xMat = new THREE.MeshBasicMaterial({ color: 0xdc2626 });
                        const xLine1 = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.2, 0.12), xMat);
                        xLine1.rotation.z = Math.PI / 4;
                        xLine1.position.set(0, 1.6, 0.01);
                        const xLine2 = xLine1.clone();
                        xLine2.rotation.z = -Math.PI / 4;
                        signGroup.add(xLine1);
                        signGroup.add(xLine2);

                        signGroup.position.set(obsX, 0, z);
                        signGroup.userData = { type: 'obstacle', radius: 1.1 };
                        scene.add(signGroup);
                        obstacles.push(signGroup);
                    } else {
                        // 3. Oncoming Train Obstacle
                        const enemyTrain = createEnemyTrainMesh();
                        enemyTrain.position.set(obsX, 0, z);
                        enemyTrain.userData = { type: 'obstacle', radius: 1.3, isMoving: true, speed: 12 };
                        scene.add(enemyTrain);
                        obstacles.push(enemyTrain);
                    }
                } else if (randType < 0.55) {
                    // --- JUMP RAMP ---
                    const trackIndex = Math.floor(Math.random() * 3);
                    const rampX = TRACK_X_POS[trackIndex];

                    const rampGeo = new THREE.BoxGeometry(2.0, 1.2, 6.0);
                    const rampMat = new THREE.MeshStandardMaterial({ color: 0xeab308, roughness: 0.4 }); // Yellow ramp
                    const ramp = new THREE.Mesh(rampGeo, rampMat);
                    ramp.rotation.x = Math.PI / 12; // Incline angle
                    ramp.position.set(rampX, 0.2, z);
                    ramp.castShadow = true;
                    ramp.userData = { type: 'ramp', zStart: z + 3, zEnd: z - 3, x: rampX };
                    scene.add(ramp);
                    ramps.push(ramp);

                    // High Airborne Coins following ramp
                    for (let cZ = z - 4; cZ >= z - 18; cZ -= 3.5) {
                        const height = 3.5 + Math.sin((z - cZ) / 14 * Math.PI) * 4.5;
                        spawnCoin(rampX, height, cZ);
                    }
                } else {
                    // --- COIN COLLECTIBLES ---
                    const coinLayout = Math.random();

                    if (coinLayout < 0.5) {
                        // Pattern A: Centered directly on track
                        const trackIndex = Math.floor(Math.random() * 3);
                        for (let cZ = z; cZ > z - 12; cZ -= 3) {
                            spawnCoin(TRACK_X_POS[trackIndex], 1.2, cZ);
                        }
                    } else {
                        // Pattern B: Placed BETWEEN tracks (Requires 斜跨 Diagonal Straddle)
                        const betweenX = Math.random() < 0.5 ? -TRACK_SPACING / 2 : TRACK_SPACING / 2;
                        for (let cZ = z; cZ > z - 12; cZ -= 3) {
                            spawnCoin(betweenX, 1.2, cZ);
                        }
                    }
                }
            }
        }

        // Oncoming Train Mesh Helper
        function createEnemyTrainMesh() {
            const group = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(2.2, 2.7, 8.0);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 }); // Red body
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.85;
            group.add(body);

            const windowMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
            const win = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.9, 0.1), windowMat);
            win.position.set(0, 2.2, 4.01);
            group.add(win);

            return group;
        }

        // Coin Spawner Helper (Glow Rhombus / Cube)
        function spawnCoin(x, y, z) {
            const coinGeo = new THREE.OctahedronGeometry(0.5, 0);
            const coinMat = new THREE.MeshStandardMaterial({
                color: 0xfacc15,
                emissive: 0xeab308,
                emissiveIntensity: 0.6,
                metalness: 0.8,
                roughness: 0.2
            });
            const coin = new THREE.Mesh(coinGeo, coinMat);
            coin.position.set(x, y, z);
            coin.castShadow = true;
            coin.userData = { type: 'coin' };
            scene.add(coin);
            coins.push(coin);
        }

        // --- CONTROLS & INPUT HANDLING ---
        function setupControls() {
            // Keyboard Listener
            window.addEventListener('keydown', (e) => {
                if (!isPlaying) return;

                const key = e.key.toLowerCase();

                // Front Bogie Movement (A/D or Left/Right Arrow)
                if (key === 'a' || e.key === 'ArrowLeft') {
                    if (frontTargetLane > -1) frontTargetLane--;
                } else if (key === 'd' || e.key === 'ArrowRight') {
                    if (frontTargetLane < 1) frontTargetLane++;
                }

                // Rear Bogie Movement (Q/E, Z/X, or Down Arrow)
                if (key === 'q' || key === 'z') {
                    if (rearTargetLane > -1) rearTargetLane--;
                } else if (key === 'e' || key === 'x' || e.key === 'ArrowDown') {
                    if (rearTargetLane < 1) rearTargetLane++;
                }
            });

            // Touch UI Buttons Listeners
            document.getElementById('btn-front-left').addEventListener('click', () => { if (isPlaying && frontTargetLane > -1) frontTargetLane--; });
            document.getElementById('btn-front-right').addEventListener('click', () => { if (isPlaying && frontTargetLane < 1) frontTargetLane++; });
            document.getElementById('btn-rear-left').addEventListener('click', () => { if (isPlaying && rearTargetLane > -1) rearTargetLane--; });
            document.getElementById('btn-rear-right').addEventListener('click', () => { if (isPlaying && rearTargetLane < 1) rearTargetLane++; });

            // Start Button Click
            startBtn.addEventListener('click', startGame);
        }

        // --- GAME LOOP & UPDATES ---
        function startGame() {
            // Reset Game Variables
            score = 0;
            distanceTraveled = 0;
            currentSpeed = INITIAL_SPEED;
            frontTargetLane = 0;
            rearTargetLane = 0;
            frontX = 0;
            rearX = 0;
            trainY = 0;
            trainVY = 0;
            isGrounded = true;
            spawnZ = -50;

            // Clear Existing Entities
            obstacles.forEach(o => scene.remove(o));
            coins.forEach(c => scene.remove(c));
            ramps.forEach(r => scene.remove(r));
            tracksGroup.clear();

            obstacles = [];
            coins = [];
            ramps = [];

            // Spawn Initial Track Chunks
            for (let i = 0; i < 4; i++) {
                generateTrackChunk(spawnZ, SPAWN_CHUNK_SIZE);
                spawnZ -= SPAWN_CHUNK_SIZE;
            }

            // UI Update
            scoreEl.innerText = '0';
            speedEl.innerText = Math.round(currentSpeed);
            distanceEl.innerText = '0 m';
            gameModal.classList.add('hidden');

            isPlaying = true;
            clock.start();
        }

        function gameOver() {
            isPlaying = false;

            // High score check
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('acrobatic_train_highscore', highScore);
                highScoreEl.innerText = highScore;
            }

            // Modal text update
            modalTitle.innerText = "電車脫軌 GAME OVER";
            modalSubtitle.innerHTML = `最終得分：<b class="text-amber-400 text-lg">${score}</b> | 行駛距離：<b class="text-emerald-400 text-lg">${Math.floor(distanceTraveled)}m</b>`;
            startBtn.innerText = "重新開始 RESTART";
            gameModal.classList.remove('hidden');
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);

            if (isPlaying) {
                updateTrainPhysics(delta);
                updateWorldAndEntities(delta);
                checkCollisions();
                updateCamera();
            } else if (trainGroup) {
                // Subtle idle rotation menu effect
                trainGroup.rotation.y = Math.sin(Date.now() * 0.001) * 0.05;
            }

            renderer.render(scene, camera);
        }

        // --- TRAIN & BOGIE PHYSICS ENGINE ---
        function updateTrainPhysics(delta) {
            // Speed progression
            currentSpeed = Math.min(MAX_SPEED, currentSpeed + SPEED_INCREMENT * delta);
            const moveDistance = currentSpeed * delta;
            distanceTraveled += moveDistance;

            // HUD UI Update
            speedEl.innerText = Math.round(currentSpeed * 2.2); // Speed scale display km/h
            distanceEl.innerText = `${Math.floor(distanceTraveled)} m`;

            // Interpolate Front & Rear Bogie Lateral (X) Positions smoothly
            const frontTargetX = TRACK_X_POS[frontTargetLane + 1];
            const rearTargetX = TRACK_X_POS[rearTargetLane + 1];

            const lerpSpeed = 8.5 * delta;
            frontX += (frontTargetX - frontX) * lerpSpeed;
            rearX += (rearTargetX - rearX) * lerpSpeed;

            // Update Bogie Positions in Local/World Space
            frontBogieObj.position.x = frontX;
            rearBogieObj.position.x = rearX;

            // Calculate Train Center Position & Body Pitch/Yaw Angle (斜跨姿態)
            const centerX = (frontX + rearX) / 2;
            const deltaX = frontX - rearX;
            const yawAngle = Math.atan2(deltaX, BOGIE_DISTANCE);

            // Train Vertical Jump Physics
            if (!isGrounded) {
                trainVY -= GRAVITY * delta;
                trainY += trainVY * delta;

                if (trainY <= 0) {
                    trainY = 0;
                    trainVY = 0;
                    isGrounded = true;
                }
            }

            // Check Ramp Launch Interactions
            ramps.forEach(ramp => {
                const rZ = ramp.position.z;
                // If train is near ramp z position and aligned on track
                if (Math.abs(rZ) < 2.0 && Math.abs(centerX - ramp.userData.x) < 1.2 && isGrounded) {
                    // Trigger Jump!
                    trainVY = JUMP_VELOCITY;
                    isGrounded = false;
                }
            });

            // Set Main Train Group Translation & Rotation
            trainGroup.position.x = centerX;
            trainGroup.position.y = trainY;

            // Set Body Orientation Angle relative to tracks
            trainBodyObj.rotation.y = yawAngle;

            // Slight Roll tilt dynamic when straddling diagonally
            trainBodyObj.rotation.z = -deltaX * 0.06;
            trainBodyObj.rotation.x = isGrounded ? 0 : -trainVY * 0.015; // Pitch angle during flight
        }

        // --- WORLD CHUNK & ENTITIES SCROLLING ---
        function updateWorldAndEntities(delta) {
            const moveDist = currentSpeed * delta;

            // Move Track Chunks towards viewer (+Z)
            tracksGroup.children.forEach(chunk => {
                chunk.position.z += moveDist;
            });

            // Move Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += moveDist;

                // Move oncoming enemy train faster
                if (obs.userData.isMoving) {
                    obs.position.z += obs.userData.speed * delta;
                }

                // Despawn behind camera
                if (obs.position.z > 20) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            // Move Ramps
            for (let i = ramps.length - 1; i >= 0; i--) {
                const ramp = ramps[i];
                ramp.position.z += moveDist;
                if (ramp.position.z > 20) {
                    scene.remove(ramp);
                    ramps.splice(i, 1);
                }
            }

            // Move & Animate Coins
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                coin.position.z += moveDist;
                coin.rotation.y += 3.0 * delta; // Rotation spin

                if (coin.position.z > 20) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                }
            }

            // Procedural Infinite Track Chunk Spawning
            if (spawnZ + tracksGroup.position.z > -RENDER_DISTANCE) {
                generateTrackChunk(spawnZ, SPAWN_CHUNK_SIZE);
                spawnZ -= SPAWN_CHUNK_SIZE;
            }
        }

        // --- COLLISION DETECTION & SCORE PICKUP ---
        function checkCollisions() {
            // Train Key Collision Points (Front Bogie, Center, Rear Bogie)
            const frontWorldPos = new THREE.Vector3(frontX, trainY + 1.0, -BOGIE_DISTANCE / 2);
            const rearWorldPos = new THREE.Vector3(rearX, trainY + 1.0, BOGIE_DISTANCE / 2);
            const centerWorldPos = new THREE.Vector3((frontX + rearX) / 2, trainY + 1.0, 0);

            // 1. Obstacle Collision Check
            for (let obs of obstacles) {
                const obsPos = obs.position;
                const radius = obs.userData.radius || 1.0;

                // Only check collision when obstacle is near the train Z range
                if (Math.abs(obsPos.z) < 5.0) {
                    // Check distance against front, center, and rear of train
                    const dFront = frontWorldPos.distanceTo(obsPos);
                    const dCenter = centerWorldPos.distanceTo(obsPos);
                    const dRear = rearWorldPos.distanceTo(obsPos);

                    if (dFront < radius + 0.8 || dCenter < radius + 0.9 || dRear < radius + 0.8) {
                        gameOver();
                        return;
                    }
                }
            }

            // 2. Coin Collection Check
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                const cPos = coin.position;

                if (Math.abs(cPos.z) < 4.0) {
                    // Check against full train body segment
                    const dFront = frontWorldPos.distanceTo(cPos);
                    const dCenter = centerWorldPos.distanceTo(cPos);
                    const dRear = rearWorldPos.distanceTo(cPos);

                    if (dFront < 1.6 || dCenter < 1.6 || dRear < 1.6) {
                        // Collect Coin!
                        score += 10;
                        scoreEl.innerText = score;

                        // Create Pickup Sparkle Visual Effect
                        createPickupEffect(cPos.x, cPos.y, cPos.z);

                        // Remove Coin
                        scene.remove(coin);
                        coins.splice(i, 1);
                    }
                }
            }
        }

        // Collect Sparkle Particle Effect
        function createPickupEffect(x, y, z) {
            const particleCount = 8;
            const pGeo = new THREE.SphereGeometry(0.12, 4, 4);
            const pMat = new THREE.MeshBasicMaterial({ color: 0xfde047 });

            for (let i = 0; i < particleCount; i++) {
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.set(x, y, z);
                scene.add(p);

                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 6,
                    Math.random() * 6 + 2,
                    (Math.random() - 0.5) * 6
                );

                // Animate particle burst
                let startTime = Date.now();
                const anim = () => {
                    const elapsed = (Date.now() - startTime) / 1000;
                    if (elapsed < 0.4) {
                        p.position.addScaledVector(velocity, 0.016);
                        p.scale.multiplyScalar(0.92);
                        requestAnimationFrame(anim);
                    } else {
                        scene.remove(p);
                    }
                };
                anim();
            }
        }

        // --- CAMERA SMOOTH FOLLOW ---
        function updateCamera() {
            const trainCenterX = trainGroup.position.x;
            const targetCamX = trainCenterX * 0.45; // Subtle camera shift tracking body tilt
            const targetCamY = 6.5 + trainY * 0.5;
            const targetCamZ = 12.5;

            // Smooth Dampening Interpolation
            camera.position.x += (targetCamX - camera.position.x) * 0.1;
            camera.position.y += (targetCamY - camera.position.y) * 0.1;
            camera.position.z = targetCamZ;

            camera.lookAt(trainCenterX * 0.2, 1.8 + trainY * 0.3, -10);
        }

        // Screen Resize Listener
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize on load
        window.onload = init;
    </script>
