<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Arena - Retro Arcade Duel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #0b0b12;
            color: #fff;
            user-select: none;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
            width: min(600px, calc(100vw - 32px), calc(100dvh - 300px));
            height: auto;
            image-rendering: pixelated;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.5);
        }

        #main-menu {
            max-height: calc(100dvh - 32px);
            overflow-y: auto;
        }

        #game-container {
            width: min(100%, 600px);
        }

        #game-container > div:first-child {
            width: 100%;
            padding: 12px;
            font-size: 12px;
            gap: 8px;
        }

        #game-container > div:first-child > div {
            min-width: 0;
            font-size: 12px;
        }

        #game-container > div:first-child span {
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        #timer {
            font-size: 24px !important;
        }

        #hud-level {
            font-size: 12px !important;
        }

        #game-container > div:first-child div {
            overflow-wrap: anywhere;
        }

        #game-container > div:nth-child(2) {
            width: 100%;
        }

        #joystick-base,
        #floating-btn {
            width: clamp(76px, 13vw, 104px);
            height: clamp(76px, 13vw, 104px);
        }

        #joystick-stick,
        #floating-btn > div {
            width: clamp(38px, 7vw, 56px);
            height: clamp(38px, 7vw, 56px);
        }

        #modal-title,
        #pause-overlay h2 {
            font-size: clamp(20px, 6vw, 42px) !important;
        }

        #modal-message,
        #pause-overlay p {
            font-size: clamp(13px, 3vw, 22px) !important;
        }

        #modal-btn {
            padding: 14px 20px;
            font-size: clamp(12px, 2.8vw, 20px) !important;
        }

        @media (orientation: portrait) and (min-width: 600px) and (max-width: 1024px) {
            body {
                padding: 12px;
            }

            #main-menu {
                width: min(100%, 760px);
                padding: clamp(24px, 5vw, 44px);
            }

            #main-menu h1 {
                font-size: clamp(42px, 6vw, 58px);
                margin-bottom: 24px;
            }

            #main-menu > p {
                font-size: clamp(19px, 2.8vw, 26px);
                margin-bottom: 16px;
            }

            #main-menu > div:nth-of-type(1) {
                margin-top: 12px;
                padding: clamp(16px, 3vw, 26px);
                font-size: clamp(15px, 2.2vw, 20px);
            }

            #main-menu > div:nth-of-type(1) p {
                font-size: inherit;
            }

            #main-menu button {
                padding: 18px;
                font-size: clamp(24px, 3.8vw, 34px);
            }

            #game-container {
                width: min(100%, 680px);
            }

            canvas {
                width: min(600px, calc(100vw - 40px), calc(100dvh - 260px));
            }

            #game-container > div:first-child {
                padding: 10px;
                font-size: 12px;
                gap: 8px;
            }

            #game-container > div:first-child > div {
                max-width: 38%;
                font-size: 12px;
            }

            #game-container > div:first-child span {
                font-size: 12px;
            }

            #timer {
                font-size: 22px !important;
            }

            #hud-level {
                font-size: 12px !important;
            }

            #game-container > div:last-child {
                display: none;
            }
        }

        @media (max-width: 520px) {
            canvas {
                width: min(600px, calc(100vw - 32px), calc(100dvh - 260px));
            }

            #game-container > div:first-child {
                padding: 8px;
                font-size: 9px;
                gap: 4px;
            }

            #game-container > div:first-child > div {
                max-width: 36%;
            }

            #timer {
                font-size: 18px !important;
            }

            #hud-level {
                font-size: 9px !important;
            }

            #main-menu {
                padding: 20px;
            }

            #main-menu h1 {
                font-size: 32px;
            }

            #main-menu > p {
                font-size: 14px;
            }

            #main-menu > p > div {
                font-size: 12px;
            }

            #game-container > div:last-child {
                font-size: 10px;
            }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- 主選單畫面 (文字已放大 2.4 倍) -->
    <div id="main-menu" class="flex flex-col items-center justify-center z-10 max-w-2xl w-full p-10 rounded-lg border-4 border-indigo-600 bg-slate-950 text-center shadow-2xl">
        <h1 class="text-[42px] md:text-[56px] font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-pink-500 mb-8 animate-pulse">坦克對射</h1>
        
                <div class="mb-8 text-center text-slate-300 leading-relaxed">
            <p class="text-amber-400 font-bold text-xl md:text-2xl">【通關條件】收集 5 粒金幣 或 擊破所有敵機！</p>
            <p class="mt-5 text-sm md:text-base text-blue-300">WASD 移動　・　滑鼠瞄準　・　按住左鍵開火　・　空白鍵暫停</p>
        </div>

        <div class="space-y-4 w-full">
            <button onclick="window.initAndStart()" class="w-full py-6 px-6 bg-blue-600 hover:bg-blue-500 text-[38px] rounded border-b-4 border-blue-800 transition active:translate-y-1">
                START 
            </button>
        </div>
    </div>

    <!-- 遊戲進行畫面 -->
    <div id="game-container" class="hidden flex flex-col items-center relative">
        <!-- 頂部計分板與狀態列 (文字已放大 2.4 倍) -->
        <div class="w-[600px] bg-slate-950 border-4 border-slate-800 p-4 mb-2 flex justify-between items-center text-[29px] rounded-t-lg">
            <div class="flex flex-col items-start space-y-2 max-w-[240px]">
                <span class="text-blue-400 font-bold text-[31px]">P1: BLUE</span>
                <span class="flex items-center gap-1">HP: <span id="p1-hearts" class="text-red-500 tracking-tight">❤️❤️❤️</span></span>，
                <span class="text-amber-400 mt-1 font-bold">COINS: <span id="p1-coins">0/5</span></span>
                <span class="text-amber-400 mt-1 font-bold">SCORE: <span id="p1-score">0000</span></span>
            </div>

            <div class="text-center">
                <div class="text-slate-400 text-[31px] mb-2" id="hud-level">LEVEL 01</div>
                <div class="text-white text-[43px] font-bold bg-slate-900 px-4 py-2 rounded border border-slate-700" id="timer">01:30</div>
            </div>

            <div class="flex flex-col items-end space-y-2">
                <span class="text-pink-500 font-bold text-[31px]">ENEMIES</span>
                <span class="flex items-center gap-1">REMAINING: <span id="enemies-left" class="text-pink-500 font-bold">1</span></span>
            </div>
        </div>

        <div class="relative bg-slate-950 p-1 border-4 border-indigo-900 rounded-b-lg shadow-inner">
            <canvas id="gameCanvas" width="600" height="600" class="block bg-slate-900"></canvas>
            
            

            <!-- 結算彈窗 (文字已放大 2.4 倍) -->
            <div id="game-modal" class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-50 p-8 text-center">
                <h2 id="modal-title" class="text-[72px] font-bold mb-6 animate-pulse">LEVEL CLEARED!</h2>
                <p id="modal-message" class="text-[41px] text-slate-300 mb-8 max-w-xl leading-relaxed"></p>
                <button id="modal-btn" class="py-6 px-12 bg-green-600 hover:bg-green-500 text-[38px] rounded border-b-4 border-green-800 transition active:translate-y-1">
                    NEXT LEVEL
                </button>
            </div>

            <!-- 暫停遮罩 (文字已放大 2.4 倍) -->
            <div id="pause-overlay" class="hidden absolute inset-0 bg-black/75 flex flex-col items-center justify-center z-40 text-center">
                <div class="border-4 border-indigo-600 bg-slate-950 p-10 rounded shadow-2xl max-w-lg">
                    <h2 class="text-[72px] font-bold mb-6 text-white animate-pulse">GAME PAUSED</h2>
                    <p class="text-[31px] text-indigo-300 leading-relaxed">PRESS [SPACE] AGAIN TO CONTINUE</p>
                </div>
            </div>
        </div>

        
    </div>

    <script>
        // 音效合成器 (Web Audio API)
        class SoundFX {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playShoot() {
                this.init();
                const ctx = this.ctx, osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(450, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.15);
            }
            playBounce() {
                this.init();
                const ctx = this.ctx, osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.setValueAtTime(600, ctx.currentTime + 0.03);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.08);
            }
            playExplosion() {
                this.init();
                const ctx = this.ctx, bufferSize = ctx.sampleRate * 0.4, buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate), data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = ctx.createBufferSource(); noise.buffer = buffer;
                const filter = ctx.createBiquadFilter(); filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.35);
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
                noise.start(); noise.stop(ctx.currentTime + 0.4);
            }
            playCoin() {
                this.init();
                const ctx = this.ctx, osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.setValueAtTime(880.00, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.25);
            }
            playPowerup() {
                this.init();
                const ctx = this.ctx, osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.25);
            }
        }

        const sfx = new SoundFX();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameActive = false, paused = false, timeLeft = 90, timerInterval = null;
        let currentLevel = 1, cumulativeScore = 0, levelStartTime = 0;

        const trackCanvas = document.createElement('canvas');
        trackCanvas.width = 600; trackCanvas.height = 600;
        const trackCtx = trackCanvas.getContext('2d');

                let mouseX = 300, mouseY = 300, isMouseDown = false;
        const pressedKeys = new Set();

                window.addEventListener('keydown', (e) => {
            if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space'].includes(e.code)) e.preventDefault();
            if (e.code === 'Space') {
                if (gameActive && !e.repeat) {
                    paused = !paused;
                    document.getElementById('pause-overlay').classList.toggle('hidden', !paused);
                }
                return;
            }
            pressedKeys.add(e.code);
        });
        window.addEventListener('keyup', (e) => pressedKeys.delete(e.code));
        window.addEventListener('blur', () => pressedKeys.clear());

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });
        canvas.addEventListener('mousedown', (e) => { if (e.button === 0) isMouseDown = true; });
        window.addEventListener('mouseup', (e) => { if (e.button === 0) isMouseDown = false; });

        const MAP_SIZE = 600, BORDER_SIZE = 20;
        const obstacles = [
            { x: 300, y: 160, r: 45, points: [] },
            { x: 180, y: 400, r: 40, points: [] },
            { x: 420, y: 360, r: 42, points: [] }
        ];

        function generateRockShapes() {
            obstacles.forEach(rock => {
                rock.points = [];
                const numSides = 12;
                for (let i = 0; i < numSides; i++) {
                    const angle = (i / numSides) * Math.PI * 2;
                    const variance = 0.85 + Math.random() * 0.3;
                    rock.points.push({ x: Math.cos(angle) * rock.r * variance, y: Math.sin(angle) * rock.r * variance });
                }
            });
        }

        function getSafeSpawnPos(radius, avoidEntities = []) {
            let attempts = 0;
            while (attempts < 200) {
                let rx = BORDER_SIZE + radius + 30 + Math.random() * (MAP_SIZE - 2 * BORDER_SIZE - 2 * radius - 60);
                let ry = BORDER_SIZE + radius + 30 + Math.random() * (MAP_SIZE - 2 * BORDER_SIZE - 2 * radius - 60);
                let tooClose = false;
                for (let rock of obstacles) {
                    if (Math.hypot(rx - rock.x, ry - rock.y) < rock.r + radius + 15) { tooClose = true; break; }
                }
                if (!tooClose) {
                    for (let entity of avoidEntities) {
                        if (entity && Math.hypot(rx - entity.x, ry - entity.y) < 50) { tooClose = true; break; }
                    }
                }
                if (!tooClose) return { x: rx, y: ry };
                attempts++;
            }
            return { x: 300, y: 300 };
        }

        function initTrackCanvas() {
            trackCtx.fillStyle = '#0f111a';
            trackCtx.fillRect(0, 0, 600, 600);
            trackCtx.strokeStyle = '#1e2338';
            trackCtx.lineWidth = 2;
            for (let x = BORDER_SIZE; x < MAP_SIZE - BORDER_SIZE; x += 30) {
                trackCtx.beginPath(); trackCtx.moveTo(x, BORDER_SIZE); trackCtx.lineTo(x, MAP_SIZE - BORDER_SIZE); trackCtx.stroke();
            }
            for (let y = BORDER_SIZE; y < MAP_SIZE - BORDER_SIZE; y += 30) {
                trackCtx.beginPath(); trackCtx.moveTo(BORDER_SIZE, y); trackCtx.lineTo(MAP_SIZE - BORDER_SIZE, y); trackCtx.stroke();
            }
        }

        class Tank {
            constructor(id, x, y, color, controls) {
                this.id = id; this.x = x; this.y = y; this.color = color; this.controls = controls;
                this.angle = 0; this.turretAngle = 0; this.speed = 2.0; this.radius = 20;
                this.hp = 3; this.maxHp = 3; this.lastShotTime = 0; this.cooldown = 350;
            }

            update() {
                if (this.hp <= 0) return;
                let moveX = 0, moveY = 0;

                                if (this.controls === 'wasd') {
                    moveX = (pressedKeys.has('KeyD') ? 1 : 0) - (pressedKeys.has('KeyA') ? 1 : 0);
                    moveY = (pressedKeys.has('KeyS') ? 1 : 0) - (pressedKeys.has('KeyW') ? 1 : 0);
                    if (moveX !== 0 || moveY !== 0) {
                        const length = Math.hypot(moveX, moveY);
                        moveX = (moveX / length) * this.speed;
                        moveY = (moveY / length) * this.speed;
                        this.angle = Math.atan2(moveY, moveX);
                    }

                    this.turretAngle = Math.atan2(mouseY - this.y, mouseX - this.x);
                    if (isMouseDown) this.shoot();
                } else {
                    if (p1 && p1.hp > 0) {
                        this.turretAngle = Math.atan2(p1.y - this.y, p1.x - this.x);
                        const dist = Math.hypot(p1.x - this.x, p1.y - this.y);
                        if (dist > 200) { moveX = Math.sign(p1.x - this.x); moveY = Math.sign(p1.y - this.y); }
                        else if (dist < 120) { moveX = -Math.sign(p1.x - this.x); moveY = -Math.sign(p1.y - this.y); }
                        if (Date.now() - this.lastShotTime > 1200 && Math.random() < 0.3) this.shoot();
                    }
                }

                if (moveX !== 0 || moveY !== 0) {
                    if (this.controls === 'wasd' && !isJoystickActive) {
                        this.angle = Math.atan2(moveY, moveX);
                    }
                    let nx = this.x + moveX;
                    let ny = this.y + moveY;
                    if (this.canMoveTo(nx, ny)) { this.x = nx; this.y = ny; }
                }
            }

            findClosestEnemy() {
                let closest = null, minDist = Infinity;
                enemies.forEach(e => {
                    if (e.hp > 0) {
                        let d = Math.hypot(e.x - this.x, e.y - this.y);
                        if (d < minDist) { minDist = d; closest = e; }
                    }
                });
                return closest;
            }

            canMoveTo(tx, ty) {
                const limit = BORDER_SIZE + this.radius;
                if (tx < limit || tx > MAP_SIZE - limit || ty < limit || ty > MAP_SIZE - limit) return false;
                for (let rock of obstacles) {
                    if (Math.hypot(tx - rock.x, ty - rock.y) < rock.r + this.radius - 6) return false;
                }
                return true;
            }

            shoot() {
                if (Date.now() - levelStartTime < 1000) return;
                const now = Date.now();
                if (now - this.lastShotTime < this.cooldown) return;
                this.lastShotTime = now;
                sfx.playShoot();

                const bx = this.x + Math.cos(this.turretAngle) * 26;
                const by = this.y + Math.sin(this.turretAngle) * 26;
                bullets.push(new Bullet(this.id, bx, by, this.turretAngle));
            }

            draw() {
                if (this.hp <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = this.color === 'blue' ? '#1d4ed8' : '#be123c';
                ctx.fillRect(-14, -10, 28, 20);
                ctx.restore();

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.turretAngle);
                ctx.fillStyle = this.color === 'blue' ? '#1e40af' : '#9f1239';
                ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#475569'; ctx.fillRect(0, -3, 22, 6);
                ctx.restore();

                if (this.id !== 1) {
                    ctx.save();
                    // Canvas 文字已放大 2.4 倍 (10px -> 24px)
                    ctx.font = '24px sans-serif'; ctx.textAlign = 'center';
                    let hStr = ''; for (let i = 0; i < this.maxHp; i++) hStr += i < this.hp ? '❤️' : '🖤';
                    ctx.fillText(hStr, this.x, this.y - this.radius - 15);
                    ctx.restore();
                }
            }
        }

        class Bullet {
            constructor(ownerId, x, y, angle) {
                this.ownerId = ownerId; this.x = x; this.y = y;
                const speed = ownerId === 1 ? 5 : 4.25;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.radius = 4; this.bounces = 0;
                this.color = ownerId === 1 ? '#60a5fa' : '#fb7185';
            }

            update() {
                this.x += this.vx; this.y += this.vy;
                const limitMin = BORDER_SIZE + this.radius, limitMax = MAP_SIZE - BORDER_SIZE - this.radius;
                let bounced = false;

                if (this.x < limitMin) { this.x = limitMin; this.vx = Math.abs(this.vx); bounced = true; }
                if (this.x > limitMax) { this.x = limitMax; this.vx = -Math.abs(this.vx); bounced = true; }
                if (this.y < limitMin) { this.y = limitMin; this.vy = Math.abs(this.vy); bounced = true; }
                if (this.y > limitMax) { this.y = limitMax; this.vy = -Math.abs(this.vy); bounced = true; }

                obstacles.forEach(rock => {
                    const dx = this.x - rock.x, dy = this.y - rock.y;
                    const distance = Math.hypot(dx, dy);
                    const minDistance = rock.r + this.radius;
                    if (distance < minDistance) {
                        const speed = Math.hypot(this.vx, this.vy);
                        const nx = distance > 0 ? dx / distance : -this.vx / speed;
                        const ny = distance > 0 ? dy / distance : -this.vy / speed;
                        const dot = this.vx * nx + this.vy * ny;
                        if (dot < 0) {
                            this.vx -= 2 * dot * nx;
                            this.vy -= 2 * dot * ny;
                            bounced = true;
                        }
                        this.x = rock.x + nx * minDistance;
                        this.y = rock.y + ny * minDistance;
                    }
                });

                if (bounced) { this.bounces++; sfx.playBounce(); }
                return this.bounces <= 1;
            }

            draw() {
                ctx.save();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
        }

        let p1 = null, enemies = [], bullets = [], coins = [], coinsCollected = 0;

        function resetGame(nextLvl = false) {
            if (nextLvl) currentLevel++;
            else { currentLevel = 1; cumulativeScore = 0; timeLeft = 90; }

            paused = false;
            document.getElementById('pause-overlay').classList.add('hidden');

            p1 = new Tank(1, 100, 300, 'blue', 'wasd');
            p1.maxHp = currentLevel + 2; p1.hp = p1.maxHp;

            enemies = [];
            let avoidList = [p1];
            for (let i = 0; i < currentLevel; i++) {
                let pos = getSafeSpawnPos(20, avoidList);
                let enemy = new Tank(2 + i, pos.x, pos.y, 'red', 'ai');
                enemies.push(enemy); avoidList.push(enemy);
            }

            bullets = [];
            generateRockShapes();
            initTrackCanvas();

            coins = []; coinsCollected = 0;
            for (let i = 0; i < 5; i++) {
                let pos = getSafeSpawnPos(12, [...avoidList, ...coins]);
                coins.push({ x: pos.x, y: pos.y, radius: 12, angle: 0 });
            }

            levelStartTime = Date.now();
            updateUI();

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (gameActive && !paused) {
                    timeLeft--;
                    updateUI();
                    if (timeLeft <= 0) showModal("TIMEOUT!", "時間耗盡！", "RETRY", returnToMenu);
                }
            }, 1000);
        }

        function updateUI() {
            let hStr = ''; for (let i = 0; i < p1.maxHp; i++) hStr += i < p1.hp ? '❤️' : '🖤';
            document.getElementById('p1-hearts').innerHTML = hStr;
            document.getElementById('p1-score').innerText = String(cumulativeScore).padStart(4, '0');
            document.getElementById('p1-coins').innerText = `${coinsCollected}/5`;
            document.getElementById('hud-level').innerText = `LEVEL ${String(currentLevel).padStart(2, '0')}`;
            document.getElementById('enemies-left').innerText = enemies.filter(e => e.hp > 0).length;
            
            let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
            document.getElementById('timer').innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function canBulletHitTank(bullet, tank) {
            if (bullet.ownerId === 1) {
                return tank.id !== 1 || bullet.bounces > 0;
            }
            return tank.id === 1 || (tank.id === bullet.ownerId && bullet.bounces > 0);
        }

        function checkCollisions() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                if (p1.hp > 0 && canBulletHitTank(b, p1) && Math.hypot(b.x - p1.x, b.y - p1.y) < p1.radius + b.radius) {
                    damageTank(p1); bullets.splice(i, 1); continue;
                }
                for (let enemy of enemies) {
                    if (enemy.hp > 0 && canBulletHitTank(b, enemy) && Math.hypot(b.x - enemy.x, b.y - enemy.y) < enemy.radius + b.radius) {
                        damageTank(enemy); bullets.splice(i, 1); break;
                    }
                }
            }

            if (p1.hp > 0) {
                for (let i = coins.length - 1; i >= 0; i--) {
                    if (Math.hypot(p1.x - coins[i].x, p1.y - coins[i].y) < p1.radius + coins[i].radius) {
                        sfx.playCoin(); coins.splice(i, 1); coinsCollected++;
                        cumulativeScore += 200; updateUI();
                        if (coinsCollected === 5) showModal("GOLD COLLECTED!", "恭喜集齊5粒金幣！", "NEXT LEVEL", () => { resetGame(true); gameActive = true; gameLoop(); });
                    }
                }
            }
        }

        function damageTank(tank) {
            tank.hp--; sfx.playExplosion(); updateUI();
            if (tank.hp <= 0) {
                if (tank.id === 1) {
                    showModal("GAME OVER", "你的 ❤️ 已耗盡！", "RETRY", returnToMenu);
                } else if (enemies.every(e => e.hp <= 0)) {
                    sfx.playPowerup();
                    showModal("LEVEL CLEARED!", "成功消滅所有敵機！", "NEXT LEVEL", () => { resetGame(true); gameActive = true; gameLoop(); });
                }
            }
        }

        function showModal(title, msg, btnText, callback) {
            gameActive = false;
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerHTML = msg;
            let btn = document.getElementById('modal-btn');
            btn.innerText = btnText;
            btn.onclick = () => { document.getElementById('game-modal').classList.add('hidden'); callback(); };
            document.getElementById('game-modal').classList.remove('hidden');
        }

        function returnToMenu() {
            gameActive = false; paused = false;
            document.getElementById('pause-overlay').classList.add('hidden');
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        window.initAndStart = function() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            gameActive = true; resetGame(false); gameLoop();
        };

        function drawScene() {
            ctx.clearRect(0, 0, 600, 600);
            ctx.drawImage(trackCanvas, 0, 0);

            obstacles.forEach(rock => {
                ctx.fillStyle = '#262833';
                ctx.beginPath();
                ctx.moveTo(rock.x + rock.points[0].x, rock.y + rock.points[0].y);
                rock.points.forEach(p => ctx.lineTo(rock.x + p.x, rock.y + p.y));
                ctx.closePath(); ctx.fill();
                ctx.strokeStyle = '#3d4154'; ctx.lineWidth = 3; ctx.stroke();
            });

            coins.forEach(c => {
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath(); ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2); ctx.fill();
            });

            bullets.forEach(b => b.draw());
            if (p1) p1.draw();
            enemies.forEach(e => e.draw());

            // 4邊框關顯示 (Canvas 文字已放大 2.4 倍: 10px -> 24px)
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.font = '24px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const borderText = `LVL ${currentLevel}`;

            ctx.fillText(borderText, MAP_SIZE / 2, BORDER_SIZE / 2);
            ctx.fillText(borderText, MAP_SIZE / 2, MAP_SIZE - BORDER_SIZE / 2);

            ctx.save();
            ctx.translate(BORDER_SIZE / 2, MAP_SIZE / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText(borderText, 0, 0);
            ctx.restore();

            ctx.save();
            ctx.translate(MAP_SIZE - BORDER_SIZE / 2, MAP_SIZE / 2);
            ctx.rotate(Math.PI / 2);
            ctx.fillText(borderText, 0, 0);
            ctx.restore();
            ctx.restore();

            // 開局 1 秒提示 (Canvas 文字已放大 2.4 倍: 24px -> 58px)
            if (Date.now() - levelStartTime < 1000) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, 600, 600);
                ctx.save();
                ctx.fillStyle = '#fbbf24'; 
                ctx.font = '58px "Press Start 2P"'; 
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText("READY...", MAP_SIZE/2, MAP_SIZE/2);
                ctx.restore();
            }
        }

        function gameLoop() {
            if (!gameActive) return;
            if (!paused) {
                p1.update();
                enemies.forEach(e => e.update());
                bullets = bullets.filter(b => b.update());
                checkCollisions();
            }
            drawScene();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
