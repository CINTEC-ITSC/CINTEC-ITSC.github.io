<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>噩夢競技場 - 萬聖節躲避大作戰</title>
    <!-- Google Fonts for Spooky Theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        spooky: ['Creepster', 'Noto Sans TC', 'cursive'],
                        sans: ['Noto Sans TC', 'sans-serif'],
                    },
                    colors: {
                        spookyBg: '#090314',
                        spookyBox: '#16082b',
                        spookyAccent: '#ff7700',
                        ghostWhite: '#e2e8f0',
                        vampireRed: '#e11d48',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #05010a;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        
        .spooky-border {
            border: 4px solid #86198f;
            box-shadow: 0 0 25px rgba(255, 119, 0, 0.3), inset 0 0 15px rgba(134, 25, 143, 0.5);
        }

        .text-glow-orange {
            text-shadow: 0 0 10px #ff7700, 0 0 20px #ff5500;
        }

        .text-glow-purple {
            text-shadow: 0 0 10px #c084fc, 0 0 20px #9333ea;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.96); }
        }
        .pulse-text {
            animation: pulse-glow 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-slate-100 overflow-hidden font-sans">

    <!-- Game Main Container -->
    <div id="game-container" class="relative w-[380px] sm:w-[420px] h-[580px] bg-spookyBox rounded-2xl spooky-border overflow-hidden flex flex-col items-center justify-center">
        
        <!-- HUD Overlay (Visible during play/wait) -->
        <div id="hud" class="absolute top-0 left-0 w-full px-4 py-3 flex justify-between items-center z-10 hidden bg-gradient-to-b from-black/80 to-transparent pointer-events-none">
            <div class="flex flex-col">
                <span class="text-xs font-bold text-slate-400">生存時間</span>
                <span id="current-score" class="font-spooky text-2xl text-spookyAccent text-glow-orange">0.0秒</span>
            </div>
            <div id="instruction-hud" class="text-center">
                <span class="inline-block px-3 py-1 bg-purple-900/80 border border-purple-500 rounded-full text-xs text-purple-200 font-bold pulse-text shadow-lg">
                    👆 觸控或移動游標開始！
                </span>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-xs font-bold text-slate-400">最佳紀錄</span>
                <span id="best-score" class="font-spooky text-xl text-purple-300">0.0秒</span>
            </div>
        </div>

        <!-- Canvas Game Arena -->
        <canvas id="gameCanvas" width="400" height="560" class="w-full h-full cursor-none block"></canvas>

        <!-- Audio Toggle Button (Floating top right corner of game container) -->
        <button id="audio-toggle-btn" class="absolute top-3 right-3 z-30 bg-purple-950/80 hover:bg-purple-800 text-purple-200 border border-purple-500 text-xs px-2.5 py-1 rounded-full font-bold shadow-md transition-all flex items-center gap-1 cursor-pointer">
            🔊 恐怖配樂
        </button>

        <!-- Start Menu Screen -->
        <div id="menu-screen" class="absolute inset-0 bg-spookyBg/95 backdrop-blur-sm flex flex-col items-center justify-between p-6 z-20 text-center">
            <div class="mt-2">
                <h1 class="font-spooky font-black text-3xl sm:text-4xl text-spookyAccent text-glow-orange tracking-wider leading-tight">噩夢競技場</h1>
                <p class="font-bold text-sm text-purple-400 tracking-widest mt-1">萬聖節躲避大作戰</p>
                <div class="w-24 h-1 bg-gradient-to-r from-transparent via-orange-500 to-transparent mx-auto mt-2"></div>
            </div>

            <div class="my-2 text-xs sm:text-sm text-slate-300 max-w-[310px] leading-relaxed bg-purple-950/40 p-3 rounded-xl border border-purple-800/50">
                <p>🎃 靈活閃避飛行的 <span class="text-vampireRed font-bold">吸血鬼</span> 與 <span class="text-cyan-300 font-bold">幽靈</span>！</p>
                <p class="mt-1 text-xs text-purple-300">按下開始後，怪物會靜止，直到您<span class="text-orange-400 font-bold">觸控或點擊螢幕</span>才開始移動！</p>
            </div>

            <!-- Top 5 High Scores Box -->
            <div class="w-full bg-black/50 rounded-xl p-3 border border-purple-900/60 shadow-inner">
                <h3 class="font-bold text-sm text-yellow-400 tracking-wide flex items-center justify-center gap-1">
                    <span>🏆</span> 噩夢英雄榜 TOP 5 <span>🏆</span>
                </h3>
                <ul id="score-list" class="mt-2 text-xs space-y-1.5 font-bold text-purple-200">
                    <!-- Loaded dynamically via JS -->
                </ul>
            </div>

            <!-- Start Button -->
            <button id="start-btn" class="w-full py-3.5 px-6 mb-1 bg-gradient-to-r from-orange-600 via-amber-500 to-orange-600 hover:from-orange-500 hover:to-amber-400 text-slate-950 font-black text-xl tracking-wider rounded-xl transition-all duration-200 transform hover:scale-105 active:scale-95 shadow-lg shadow-orange-600/40 border border-orange-300">
                開始遊戲
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="absolute inset-0 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-6 z-20 text-center hidden">
            <div class="text-6xl mb-2 animate-bounce">💀</div>
            <h2 class="font-black text-3xl text-red-500 text-glow-purple tracking-wider">你被抓到了！</h2>
            <p class="text-slate-400 text-sm mt-1">怪物們將你拖入了黑暗之中...</p>

            <div class="my-6 bg-purple-950/60 border border-purple-800 rounded-xl p-4 w-full max-w-[260px]">
                <span class="text-xs font-bold uppercase text-slate-400 tracking-wider">生存時間</span>
                <div id="final-score" class="font-spooky text-4xl text-spookyAccent text-glow-orange my-1">0.0秒</div>
                <div id="new-record-tag" class="hidden inline-block px-2 py-0.5 bg-yellow-500 text-slate-950 font-black text-xs rounded uppercase tracking-wider animate-pulse">
                    🎉 創下最高紀錄！
                </div>
            </div>

            <button id="restart-btn" class="w-full max-w-[260px] py-3 px-6 bg-gradient-to-r from-purple-700 to-indigo-600 hover:from-purple-600 hover:to-indigo-500 text-white font-black text-xl tracking-wider rounded-xl transition-all transform hover:scale-105 active:scale-95 shadow-lg shadow-purple-900/50 border border-purple-400">
                再試一次
            </button>
        </div>
    </div>

    <script>
        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const menuScreen = document.getElementById('menu-screen');
        const gameOverScreen = document.getElementById('gameover-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const hud = document.getElementById('hud');
        const currentScoreEl = document.getElementById('current-score');
        const bestScoreEl = document.getElementById('best-score');
        const finalScoreEl = document.getElementById('final-score');
        const scoreListEl = document.getElementById('score-list');
        const instructionHud = document.getElementById('instruction-hud');
        const newRecordTag = document.getElementById('new-record-tag');
        const audioToggleBtn = document.getElementById('audio-toggle-btn');

        // Web Audio API Soundtrack State
        let audioCtx = null;
        let isMuted = false;
        let soundtrackPlaying = false;
        let droneOsc1, droneOsc2, droneGain, noiseNode, noiseGain;
        let ambientInterval = null;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function startSoundtrack() {
            if (soundtrackPlaying || isMuted) return;
            initAudioContext();
            if (!audioCtx) return;
            soundtrackPlaying = true;

            // 1. Dark Sub-Bass Drone
            droneOsc1 = audioCtx.createOscillator();
            droneOsc1.type = 'sawtooth';
            droneOsc1.frequency.setValueAtTime(55, audioCtx.currentTime); // A1

            droneOsc2 = audioCtx.createOscillator();
            droneOsc2.type = 'triangle';
            droneOsc2.frequency.setValueAtTime(58.27, audioCtx.currentTime); // Bb1 dissonance

            const droneFilter = audioCtx.createBiquadFilter();
            droneFilter.type = 'lowpass';
            droneFilter.frequency.setValueAtTime(160, audioCtx.currentTime);

            // Slow Filter LFO sweep
            const lfo = audioCtx.createOscillator();
            lfo.frequency.setValueAtTime(0.08, audioCtx.currentTime);
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.setValueAtTime(80, audioCtx.currentTime);
            lfo.connect(droneFilter.frequency);
            lfo.start();

            droneGain = audioCtx.createGain();
            droneGain.gain.setValueAtTime(0.12, audioCtx.currentTime);

            droneOsc1.connect(droneFilter);
            droneOsc2.connect(droneFilter);
            droneFilter.connect(droneGain);
            droneGain.connect(audioCtx.destination);

            droneOsc1.start();
            droneOsc2.start();

            // 2. Eerie Wind Texture (White noise buffer through sweeping bandpass)
            const bufferSize = audioCtx.sampleRate * 2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            whiteNoise.loop = true;

            const windFilter = audioCtx.createBiquadFilter();
            windFilter.type = 'bandpass';
            windFilter.frequency.setValueAtTime(350, audioCtx.currentTime);
            windFilter.Q.setValueAtTime(2.5, audioCtx.currentTime);

            const windLfo = audioCtx.createOscillator();
            windLfo.frequency.setValueAtTime(0.15, audioCtx.currentTime);
            const windLfoGain = audioCtx.createGain();
            windLfoGain.gain.setValueAtTime(200, audioCtx.currentTime);
            windLfo.connect(windFilter.frequency);
            windLfo.start();

            noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.06, audioCtx.currentTime);

            whiteNoise.connect(windFilter);
            windFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            whiteNoise.start();

            // 3. Periodic Cinematic Spooky Chime/Sting
            ambientInterval = setInterval(() => {
                if (!soundtrackPlaying || isMuted || !audioCtx) return;
                playSpookySting();
            }, 8000);
        }

        function playSpookySting() {
            if (!audioCtx || isMuted) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';

            const freq = Math.random() > 0.4 ? 440 + Math.random() * 80 : 110;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.4, audioCtx.currentTime + 3.0);

            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 3.5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 3.6);
        }

        function stopSoundtrack() {
            soundtrackPlaying = false;
            if (ambientInterval) clearInterval(ambientInterval);
            try {
                if (droneOsc1) { droneOsc1.stop(); droneOsc1.disconnect(); }
                if (droneOsc2) { droneOsc2.stop(); droneOsc2.disconnect(); }
                if (droneGain) droneGain.disconnect();
                if (noiseGain) noiseGain.disconnect();
            } catch (e) {}
        }

        audioToggleBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            if (isMuted) {
                audioToggleBtn.innerHTML = '🔇 靜音';
                audioToggleBtn.classList.add('opacity-60');
                if (droneGain) droneGain.gain.setValueAtTime(0, audioCtx.currentTime);
                if (noiseGain) noiseGain.gain.setValueAtTime(0, audioCtx.currentTime);
            } else {
                audioToggleBtn.innerHTML = '🔊 恐怖配樂';
                audioToggleBtn.classList.remove('opacity-60');
                initAudioContext();
                if (droneGain) droneGain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                if (noiseGain) noiseGain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                if (!soundtrackPlaying && gameState !== STATE_MENU) {
                    startSoundtrack();
                }
            }
        });

        // Game States
        const STATE_MENU = 0;
        const STATE_WAITING = 1;
        const STATE_PLAYING = 2;
        const STATE_GAMEOVER = 3;
        let gameState = STATE_MENU;

        // Mechanics variables
        let score = 0;
        let startTime = 0;
        let speedMultiplier = 1;
        let animationFrameId = null;
        let globalTime = 0;

        // Spooky background particles
        const bgParticles = Array.from({ length: 30 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            speedY: -(Math.random() * 0.5 + 0.1),
            speedX: (Math.random() - 0.5) * 0.3,
            opacity: Math.random() * 0.8 + 0.2,
            color: Math.random() > 0.5 ? '#ff7700' : '#a855f7'
        }));

        // Player Square (Glowing Pumpkin Amulet Box)
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 22,
            targetX: canvas.width / 2,
            targetY: canvas.height / 2
        };

        // Monsters Setup
        let monsters = [];
        const numMonsters = 8;

        function initMonsters() {
            monsters = [];
            for (let i = 0; i < numMonsters; i++) {
                const radius = 14 + Math.random() * 4;
                let x, y;
                do {
                    x = Math.random() * (canvas.width - radius * 4) + radius * 2;
                    y = Math.random() * (canvas.height - radius * 4) + radius * 2;
                } while (Math.hypot(x - player.x, y - player.y) < 90);

                const angle = Math.random() * Math.PI * 2;
                const baseSpeed = 2.0 + Math.random() * 1.2;
                const type = i % 2 === 0 ? 'vampire' : 'ghost';

                monsters.push({
                    x: x,
                    y: y,
                    radius: radius,
                    vx: Math.cos(angle) * baseSpeed,
                    vy: Math.sin(angle) * baseSpeed,
                    type: type,
                    wingAngle: Math.random() * Math.PI,
                    ghostTrail: []
                });
            }
        }

        // Local Storage Scores
        function getHighScores() {
            try {
                const scores = localStorage.getItem('nightmare_arena_scores');
                return scores ? JSON.parse(scores) : [];
            } catch (e) {
                return [];
            }
        }

        function saveHighScore(newScore) {
            let scores = getHighScores();
            const isNewHigh = scores.length === 0 || newScore > scores[0];
            scores.push(newScore);
            scores.sort((a, b) => b - a);
            scores = scores.slice(0, 5);
            try {
                localStorage.setItem('nightmare_arena_scores', JSON.stringify(scores));
            } catch (e) {}
            return isNewHigh;
        }

        function renderHighScores() {
            const scores = getHighScores();
            scoreListEl.innerHTML = '';
            
            if (scores.length === 0) {
                scoreListEl.innerHTML = '<li class="text-purple-400 font-normal italic py-1">尚無紀錄，快來挑戰！</li>';
                bestScoreEl.textContent = '0.0秒';
                return;
            }

            bestScoreEl.textContent = scores[0].toFixed(1) + '秒';

            scores.forEach((s, index) => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center px-3 py-1 bg-purple-900/30 rounded border border-purple-800/30';
                
                let badge = `第 ${index + 1} 名`;
                if (index === 0) badge = '👑 第 1 名';
                else if (index === 1) badge = '🥈 第 2 名';
                else if (index === 2) badge = '🥉 第 3 名';

                li.innerHTML = `<span class="font-bold text-orange-400">${badge}</span><span>${s.toFixed(1)} 秒</span>`;
                scoreListEl.appendChild(li);
            });
        }

        // Handle Pointer Inputs
        function handlePointerMove(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const targetX = (clientX - rect.left) * scaleX;
            const targetY = (clientY - rect.top) * scaleY;

            player.targetX = Math.max(player.size / 2 + 5, Math.min(canvas.width - player.size / 2 - 5, targetX));
            player.targetY = Math.max(player.size / 2 + 5, Math.min(canvas.height - player.size / 2 - 5, targetY));

            if (gameState === STATE_WAITING) {
                gameState = STATE_PLAYING;
                startTime = performance.now();
                instructionHud.style.display = 'none';
            }
        }

        window.addEventListener('mousemove', (e) => {
            if (gameState === STATE_WAITING || gameState === STATE_PLAYING) {
                handlePointerMove(e.clientX, e.clientY);
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length > 0 && (gameState === STATE_WAITING || gameState === STATE_PLAYING)) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length > 0 && (gameState === STATE_WAITING || gameState === STATE_PLAYING)) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        // Start Game Button Logic
        startBtn.addEventListener('click', () => {
            menuScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            instructionHud.style.display = 'block';
            
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.targetX = canvas.width / 2;
            player.targetY = canvas.height / 2;

            initMonsters();
            speedMultiplier = 1;
            gameState = STATE_WAITING;
            
            // Start spooky background soundtrack
            startSoundtrack();

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        });

        // Restart Button Logic
        restartBtn.addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
            hud.classList.add('hidden');
            stopSoundtrack();
            renderHighScores();
        });

        // Drawing Functions
        function drawBackground() {
            const bgGradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 50, canvas.width/2, canvas.height/2, 300);
            bgGradient.addColorStop(0, '#1c0936');
            bgGradient.addColorStop(1, '#090214');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            bgParticles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;
                if (p.y < 0) p.y = canvas.height;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.opacity * (0.6 + Math.sin(globalTime * 3 + p.x) * 0.4);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            drawCobweb(0, 0, 60, 0);
            drawCobweb(canvas.width, 0, 60, Math.PI / 2);
        }

        function drawCobweb(x, y, radius, angleOffset) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angleOffset);
            ctx.strokeStyle = 'rgba(168, 85, 247, 0.15)';
            ctx.lineWidth = 1;

            for (let i = 0; i <= 4; i++) {
                const a = (i * Math.PI / 8);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(a) * radius, Math.sin(a) * radius);
                ctx.stroke();
            }

            for (let r = 15; r <= radius; r += 15) {
                ctx.beginPath();
                for (let i = 0; i <= 4; i++) {
                    const a = (i * Math.PI / 8);
                    const cx = Math.cos(a) * r;
                    const cy = Math.sin(a) * r;
                    if (i === 0) ctx.moveTo(cx, cy);
                    else ctx.quadraticCurveTo(0, 0, cx, cy);
                }
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawPlayer() {
            player.x += (player.targetX - player.x) * 0.3;
            player.y += (player.targetY - player.y) * 0.3;

            const half = player.size / 2;

            ctx.save();
            ctx.translate(player.x, player.y);

            ctx.shadowBlur = 18;
            ctx.shadowColor = '#ff7700';

            ctx.fillStyle = '#ff6600';
            ctx.beginPath();
            ctx.roundRect(-half, -half, player.size, player.size, 4);
            ctx.fill();

            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#1e0902';
            
            ctx.beginPath();
            ctx.moveTo(-half + 4, -2);
            ctx.lineTo(-half + 8, -6);
            ctx.lineTo(-half + 8, -2);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(half - 4, -2);
            ctx.lineTo(half - 8, -6);
            ctx.lineTo(half - 8, -2);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-half + 5, 3);
            ctx.lineTo(-half + 7, 6);
            ctx.lineTo(0, 4);
            ctx.lineTo(half - 7, 6);
            ctx.lineTo(half - 5, 3);
            ctx.fill();

            ctx.restore();
        }

        function drawVampire(v) {
            ctx.save();
            ctx.translate(v.x, v.y);

            v.wingAngle += 0.15;
            const flap = Math.sin(v.wingAngle) * 6;
            const dir = v.vx >= 0 ? 1 : -1;
            ctx.scale(dir, 1);

            ctx.fillStyle = '#9f1239';
            ctx.beginPath();
            ctx.moveTo(-2, 0);
            ctx.lineTo(-v.radius - 8, -6 + flap);
            ctx.lineTo(-v.radius - 4, v.radius + 4);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(2, 0);
            ctx.lineTo(v.radius + 8, -6 + flap);
            ctx.lineTo(v.radius + 4, v.radius + 4);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 10;
            ctx.shadowColor = '#e11d48';
            ctx.fillStyle = '#f1f5f9';
            ctx.beginPath();
            ctx.arc(0, 0, v.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(0, 0, v.radius, Math.PI * 1.1, Math.PI * 1.9);
            ctx.lineTo(0, -v.radius / 3);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(-v.radius / 2.5, -1, 2.5, 0, Math.PI * 2);
            ctx.arc(v.radius / 2.5, -1, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(-v.radius / 3, 4);
            ctx.lineTo(-v.radius / 4, 8);
            ctx.lineTo(-v.radius / 6, 4);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(v.radius / 6, 4);
            ctx.lineTo(v.radius / 4, 8);
            ctx.lineTo(v.radius / 3, 4);
            ctx.fill();

            ctx.restore();
        }

        function drawGhost(g) {
            g.ghostTrail.push({ x: g.x, y: g.y });
            if (g.ghostTrail.length > 6) g.ghostTrail.shift();

            for (let i = 0; i < g.ghostTrail.length; i++) {
                const pt = g.ghostTrail[i];
                const trailAlpha = (i / g.ghostTrail.length) * 0.3;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, g.radius * (i / g.ghostTrail.length), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(165, 243, 252, ${trailAlpha})`;
                ctx.fill();
            }

            ctx.save();
            ctx.translate(g.x, g.y);

            const bob = Math.sin(globalTime * 5 + g.x) * 2;

            ctx.shadowBlur = 12;
            ctx.shadowColor = '#06b6d4';
            ctx.fillStyle = 'rgba(224, 242, 254, 0.85)';

            ctx.beginPath();
            ctx.arc(0, -2 + bob, g.radius, Math.PI, 0, false);
            ctx.lineTo(g.radius, g.radius + bob);
            ctx.quadraticCurveTo(g.radius * 0.5, g.radius - 3 + bob, 0, g.radius + bob);
            ctx.quadraticCurveTo(-g.radius * 0.5, g.radius - 3 + bob, -g.radius, g.radius + bob);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#082f49';
            ctx.beginPath();
            ctx.ellipse(-g.radius / 2.5, -2 + bob, 2.5, 4, 0, 0, Math.PI * 2);
            ctx.ellipse(g.radius / 2.5, -2 + bob, 2.5, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(0, 4 + bob, 2, 3.5, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Main Game Loop
        function gameLoop() {
            globalTime += 0.016;

            drawBackground();

            if (gameState === STATE_PLAYING) {
                const currentTime = performance.now();
                score = (currentTime - startTime) / 1000;
                
                speedMultiplier = 1 + (score / 4) * 0.22; 
                currentScoreEl.textContent = score.toFixed(1) + '秒';

                for (let monster of monsters) {
                    monster.x += monster.vx * speedMultiplier;
                    monster.y += monster.vy * speedMultiplier;

                    if (monster.x - monster.radius <= 0) {
                        monster.x = monster.radius;
                        monster.vx *= -1;
                    } else if (monster.x + monster.radius >= canvas.width) {
                        monster.x = canvas.width - monster.radius;
                        monster.vx *= -1;
                    }

                    if (monster.y - monster.radius <= 0) {
                        monster.y = monster.radius;
                        monster.vy *= -1;
                    } else if (monster.y + monster.radius >= canvas.height) {
                        monster.y = canvas.height - monster.radius;
                        monster.vy *= -1;
                    }

                    const distX = Math.abs(player.x - monster.x);
                    const distY = Math.abs(player.y - monster.y);

                    if (distX < (player.size / 2 + monster.radius * 0.75) && 
                        distY < (player.size / 2 + monster.radius * 0.75)) {
                        
                        gameState = STATE_GAMEOVER;
                        stopSoundtrack();
                        const isNewHigh = saveHighScore(score);
                        
                        finalScoreEl.textContent = score.toFixed(1) + '秒';
                        if (isNewHigh) {
                            newRecordTag.classList.remove('hidden');
                        } else {
                            newRecordTag.classList.add('hidden');
                        }

                        gameOverScreen.classList.remove('hidden');
                        hud.classList.add('hidden');
                    }
                }
            }

            for (let monster of monsters) {
                if (monster.type === 'vampire') {
                    drawVampire(monster);
                } else {
                    drawGhost(monster);
                }
            }

            drawPlayer();

            if (gameState !== STATE_GAMEOVER && gameState !== STATE_MENU) {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        renderHighScores();
    </script>
</body>
</html>
